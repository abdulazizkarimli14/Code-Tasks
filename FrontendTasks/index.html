<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulyator</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <div class="calculator">
        <div class="input-container">
            <div class="input-group">
                <input type="number" id="number1" placeholder="Number-1" step="any">
            </div>
            <div class="input-group">
                <input type="number" id="number2" placeholder="Number-2" step="any">
            </div>
        </div>

        <div class="buttons-container">
            <button class="btn-toplama" onclick="toplama()">Toplama</button>
            <button class="btn-cixma" onclick="cixma()">Çıxma</button>
            <button class="btn-vurma" onclick="vurma()">Vurma</button>
            <button class="btn-bolme" onclick="bolme()">Bölmə</button>
        </div>

        <div class="result-container">
            <div id="result" class="placeholder">nəticəni buranı yazdırın</div>
        </div>
    </div>

    <script src="/assets/js/script.js"></script>
</body>
</html>
